version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 530743905127.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Building the Docker image...
      - docker build -t ratemyschools-backend .
      - docker tag ratemyschools-backend:latest 530743905127.dkr.ecr.us-east-1.amazonaws.com/ratemyschools-backend:latest
  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push 530743905127.dkr.ecr.us-east-1.amazonaws.com/ratemyschools-backend:latest
      - echo Build completed on `date`
